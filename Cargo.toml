[package]
name = "neon-dust"
version = "0.1.0"
edition = "2021"
description = "Neon Dust - synthwave 3D driving + shooting game, all procedural"

[dependencies]
bevy = { version = "0.16", features = ["wav"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
